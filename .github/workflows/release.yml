name: Release to production

on:
  push:
    tags: ["v*"]

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Backup before migrating
        env: { DATABASE_URL: "${{ secrets.PRODUCTION_DATABASE_URL }}", BACKUP_S3_URI: "${{ secrets.BACKUP_S3_URI }}", AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}", AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}" }
        run: sudo apt-get install -y postgresql-client >/dev/null && bash scripts/backup.sh
      - name: Migrate production
        env: { DATABASE_URL: "${{ secrets.PRODUCTION_DATABASE_URL }}", DATABASE_SSL: "true" }
        run: npm run db:migrate
